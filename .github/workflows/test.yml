name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python version sweep (other variations at their highest version)
          - python-version: "3.9"
            pytest-asyncio-version: "0.19.0"
            sqlalchemy-version: "2.0.0"
          - python-version: "3.12"
            pytest-asyncio-version: "0.19.0"
            sqlalchemy-version: "2.0.0"
          - python-version: "3.15-dev"
            pytest-asyncio-version: "0.19.0"
            sqlalchemy-version: "2.0.0"
          # Dep variant sweep (pin to the python version we generally test at)
          - python-version: "3.12"
            pytest-asyncio-version: "0.16.0"
            sqlalchemy-version: "2.0.0"
          - python-version: "3.12"
            pytest-asyncio-version: "0.19.0"
            sqlalchemy-version: "1.3.0"
          - python-version: "3.12"
            pytest-asyncio-version: "0.19.0"
            sqlalchemy-version: "1.4.0"

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install base dependencies
        run: uv sync

      - name: Install specific sqlalchemy version
        run: uv pip install 'sqlalchemy~=${{ matrix.sqlalchemy-version }}'

      - name: Install specific pytest-asyncio version
        run: uv pip install 'pytest-asyncio~=${{ matrix.pytest-asyncio-version }}'

      - if: ${{ matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.0.0' && matrix.pytest-asyncio-version == '0.19.0' }}
        run: uv run make lint

      - run: uv run make test-base

      - name: Install dependencies
        run: uv sync --extra postgres --extra postgres-async --extra redshift --extra mongo --extra redis --extra mysql --extra moto

      - run: uv run make test

      - name: Store test result artifacts
        uses: actions/upload-artifact@v4
        with:
          path: coverage-${{ matrix.python-version }}-${{ matrix.pytest-asyncio-version }}-${{ matrix.sqlalchemy-version }}.xml

      - name: Coveralls
        env:
          COVERALLS_FLAG_NAME: run-${{ inputs.working-directory }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: |
          uv pip install tomli coveralls
          uv run coveralls --service=github

  # Tests that postgres async fixture functions without psycopg2 installed.
  test-asyncpg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test our minimum version bound, the highest version available,
        # and something in the middle (i.e. what gets run locally).
        python-version: ["3.9"]
        sqlalchemy-version: ["1.4.0"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra postgres-async

      - name: Install specific sqlalchemy version
        run: uv pip install 'sqlalchemy~=${{ matrix.sqlalchemy-version }}'

      - run: SQLALCHEMY_WARN_20=1 uv run coverage run -a -m pytest src tests -vv -m 'asyncio'

      - name: Store test result artifacts
        uses: actions/upload-artifact@v4
        with:
          path: coverage-${{ matrix.python-version }}-${{ matrix.pytest-asyncio-version }}-${{ matrix.sqlalchemy-version }}-asyncpg.xml

      - name: Coveralls
        env:
          COVERALLS_FLAG_NAME: run-${{ inputs.working-directory }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: |
          uv pip install tomli coveralls
          uv run coveralls --service=github

  finish:
    needs:
      - test
      - test-asyncpg
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install tomli coveralls
          coveralls --service=github --finish
